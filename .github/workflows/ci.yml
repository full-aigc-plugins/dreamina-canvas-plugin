name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-verification:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run Skill scenarios
        run: python -m unittest discover -s tests/scenarios -v

      - name: Verify pinned Skill bytes
        run: python scripts/verify_dreamina_canvas_skills.py

      - name: Validate distribution
        run: python scripts/validate_distribution.py

      - name: Check whitespace
        run: git diff --check
